<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BreatheAtrium Validation Notes</title>
  <style>
    :root {
      --ink: #031418;
      --teal: #062f35;
      --teal-2: #0a4846;
      --gold: #f2b84b;
      --solar: #f7d27a;
      --mint: #9dd9c8;
      --paper: #f8f3e7;
      --cloud: #d9e7e1;
      --line: rgba(248, 243, 231, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 12%, rgba(242, 184, 75, 0.2), transparent 24%),
        linear-gradient(135deg, var(--ink), var(--teal) 52%, var(--teal-2));
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .hero,
    .panel,
    .entry {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--gold);
      color: var(--ink);
      font-weight: 950;
    }

    .eyebrow,
    label,
    .tag {
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 0;
      max-width: 780px;
      font-size: clamp(36px, 6vw, 66px);
      line-height: 0.95;
    }

    p {
      color: var(--cloud);
      line-height: 1.65;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(340px, 0.55fr);
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      padding: 22px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(248, 243, 231, 0.2);
      border-radius: 8px;
      background: rgba(3, 20, 24, 0.68);
      color: var(--paper);
      font: inherit;
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(157, 217, 200, 0.15);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--paper);
      cursor: pointer;
      font-weight: 850;
      padding: 0 16px;
    }

    button.primary {
      background: var(--gold);
      color: var(--ink);
    }

    button.danger {
      border: 1px solid rgba(242, 184, 75, 0.36);
      color: var(--gold);
    }

    .stat {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(3, 20, 24, 0.34);
      padding: 14px;
    }

    .stat strong {
      font-size: 34px;
      line-height: 1;
    }

    .entries {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      max-height: 590px;
      overflow: auto;
      padding-right: 4px;
    }

    .entry {
      padding: 14px;
      box-shadow: none;
    }

    .entry h3 {
      margin: 4px 0 8px;
      font-size: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill {
      border-radius: 999px;
      background: rgba(242, 184, 75, 0.16);
      color: var(--solar);
      font-size: 12px;
      font-weight: 750;
      padding: 5px 9px;
    }

    .empty {
      border: 1px dashed rgba(248, 243, 231, 0.3);
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .hero,
      .grid,
      .fields {
        grid-template-columns: 1fr;
      }

      .hero {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div>
        <div class="brand">
          <div class="mark">BA</div>
          <div>
            <div class="eyebrow">BreatheAtrium</div>
            <strong>Customer Validation Kit</strong>
          </div>
        </div>
        <h1>Capture proof before the pitch.</h1>
        <p>Use this offline form during quick interviews with facility managers, atrium users, and technical stakeholders. Entries stay in this browser until exported.</p>
      </div>
      <div class="stat">
        <span class="tag">Saved interviews</span>
        <strong id="count">0</strong>
        <span id="lastSaved">No entries yet</span>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <form id="validationForm">
          <div class="fields">
            <div class="field">
              <label for="respondentType">Respondent type</label>
              <select id="respondentType" name="respondentType" required>
                <option value="">Select type</option>
                <option>Facility manager</option>
                <option>Building owner</option>
                <option>Atrium user / student / staff</option>
                <option>Architect / MEP / HVAC</option>
                <option>Researcher</option>
                <option>Other stakeholder</option>
              </select>
            </div>

            <div class="field">
              <label for="buildingType">Building type</label>
              <select id="buildingType" name="buildingType" required>
                <option value="">Select building</option>
                <option>University / campus</option>
                <option>Government building</option>
                <option>Mall</option>
                <option>Hotel</option>
                <option>Office tower</option>
                <option>Airport / transport hub</option>
                <option>Other atrium building</option>
              </select>
            </div>

            <div class="field">
              <label for="painScore">Pain score</label>
              <select id="painScore" name="painScore" required>
                <option value="">1 low, 5 severe</option>
                <option value="1">1 - Low</option>
                <option value="2">2 - Mild</option>
                <option value="3">3 - Noticeable</option>
                <option value="4">4 - Serious</option>
                <option value="5">5 - Severe</option>
              </select>
            </div>

            <div class="field">
              <label for="worstTime">Worst time of day</label>
              <select id="worstTime" name="worstTime" required>
                <option value="">Select time</option>
                <option>Morning</option>
                <option>Midday</option>
                <option>Afternoon</option>
                <option>Evening</option>
                <option>During events / crowds</option>
                <option>Not sure</option>
              </select>
            </div>

            <div class="field full">
              <label for="currentSolution">Current solution / workaround</label>
              <textarea id="currentSolution" name="currentSolution" placeholder="More cooling, fans, avoiding the space, complaints, manual dampers, no workaround..." required></textarea>
            </div>

            <div class="field">
              <label for="decisionMaker">Decision maker</label>
              <input id="decisionMaker" name="decisionMaker" placeholder="Facilities director, owner, campus admin..." />
            </div>

            <div class="field">
              <label for="willingnessToPilot">Willingness to pilot</label>
              <select id="willingnessToPilot" name="willingnessToPilot" required>
                <option value="">Select willingness</option>
                <option value="No">No</option>
                <option value="Maybe">Maybe</option>
                <option value="Yes, if low disruption">Yes, if low disruption</option>
                <option value="Yes, if measured">Yes, if measured</option>
                <option value="Strong yes">Strong yes</option>
              </select>
            </div>

            <div class="field full">
              <label for="quote">Strong quote</label>
              <textarea id="quote" name="quote" placeholder="Capture their exact words. Keep it anonymous unless they approve attribution."></textarea>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Save interview note</button>
            <button type="button" id="exportCsv">Export CSV</button>
            <button type="button" id="copySummary">Copy quick summary</button>
            <button class="danger" type="button" id="clearEntries">Clear entries</button>
          </div>
        </form>
      </div>

      <aside class="panel">
        <div class="tag">Interview log</div>
        <div class="entries" id="entries"></div>
      </aside>
    </section>
  </main>

  <script>
    const storageKey = "breatheatrium.validation.entries.v1";
    const form = document.getElementById("validationForm");
    const entriesEl = document.getElementById("entries");
    const countEl = document.getElementById("count");
    const lastSavedEl = document.getElementById("lastSaved");
    const exportButton = document.getElementById("exportCsv");
    const clearButton = document.getElementById("clearEntries");
    const copySummaryButton = document.getElementById("copySummary");

    let entries = loadEntries();
    render();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const entry = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        createdAt: new Date().toISOString(),
        respondentType: formData.get("respondentType"),
        buildingType: formData.get("buildingType"),
        painScore: formData.get("painScore"),
        currentSolution: formData.get("currentSolution"),
        worstTime: formData.get("worstTime"),
        decisionMaker: formData.get("decisionMaker"),
        quote: formData.get("quote"),
        willingnessToPilot: formData.get("willingnessToPilot"),
      };

      entries = [entry, ...entries];
      saveEntries();
      form.reset();
      render();
    });

    exportButton.addEventListener("click", () => {
      if (!entries.length) {
        alert("No entries to export yet.");
        return;
      }

      const headers = [
        "createdAt",
        "respondentType",
        "buildingType",
        "painScore",
        "currentSolution",
        "worstTime",
        "decisionMaker",
        "quote",
        "willingnessToPilot",
      ];
      const csv = [
        headers.join(","),
        ...entries.map((entry) => headers.map((header) => csvEscape(entry[header] || "")).join(",")),
      ].join("\\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "breatheatrium-validation-notes.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    copySummaryButton.addEventListener("click", async () => {
      const summary = buildSummary();
      try {
        await navigator.clipboard.writeText(summary);
        alert("Quick summary copied.");
      } catch {
        prompt("Copy this quick summary:", summary);
      }
    });

    clearButton.addEventListener("click", () => {
      if (!entries.length || !confirm("Clear all saved validation entries from this browser?")) return;
      entries = [];
      saveEntries();
      render();
    });

    function loadEntries() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "[]");
      } catch {
        return [];
      }
    }

    function saveEntries() {
      localStorage.setItem(storageKey, JSON.stringify(entries));
    }

    function render() {
      countEl.textContent = entries.length;
      lastSavedEl.textContent = entries[0] ? `Last saved ${formatDate(entries[0].createdAt)}` : "No entries yet";

      if (!entries.length) {
        entriesEl.innerHTML = '<div class="empty"><strong>No interviews saved yet.</strong><p>Start with 3-5 fast conversations and export the CSV for the appendix.</p></div>';
        return;
      }

      entriesEl.innerHTML = entries
        .map(
          (entry) => `
            <article class="entry">
              <div class="meta">
                <span class="pill">${escapeHtml(entry.respondentType)}</span>
                <span class="pill">Pain ${escapeHtml(entry.painScore)}/5</span>
                <span class="pill">${escapeHtml(entry.willingnessToPilot)}</span>
              </div>
              <h3>${escapeHtml(entry.buildingType)}</h3>
              <p><strong>Current workaround:</strong> ${escapeHtml(entry.currentSolution)}</p>
              <p><strong>Worst time:</strong> ${escapeHtml(entry.worstTime)} · <strong>Decision maker:</strong> ${escapeHtml(entry.decisionMaker || "Unknown")}</p>
              ${entry.quote ? `<p><strong>Quote:</strong> "${escapeHtml(entry.quote)}"</p>` : ""}
            </article>
          `,
        )
        .join("");
    }

    function buildSummary() {
      if (!entries.length) return "No validation interviews captured yet.";
      const avgPain = entries.reduce((sum, entry) => sum + Number(entry.painScore || 0), 0) / entries.length;
      const pilotYes = entries.filter((entry) => String(entry.willingnessToPilot).toLowerCase().includes("yes") || entry.willingnessToPilot === "Strong yes").length;
      const quotes = entries
        .filter((entry) => entry.quote)
        .slice(0, 3)
        .map((entry) => `- "${entry.quote}"`)
        .join("\\n");

      return `BreatheAtrium validation snapshot\\nInterviews: ${entries.length}\\nAverage pain score: ${avgPain.toFixed(1)}/5\\nPilot-positive responses: ${pilotYes}/${entries.length}\\nStrong quotes:\\n${quotes || "- No quotes captured yet."}`;
    }

    function csvEscape(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("en-MY", {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(value));
    }
  </script>
</body>
</html>
